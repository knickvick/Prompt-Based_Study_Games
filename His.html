          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col lg:flex-row gap-6">
            <div className="flex-1 flex flex-col">
              
              {activeTab === 'board' && (
                <div className="flex-1 flex flex-col gap-6">
                  <div className="grid grid-cols-2 md:grid-cols-5 gap-3 md:gap-4 flex-1">
                    {cluesState.map((category, catIndex) => (
                      <div key={category.id} className="flex flex-col gap-3">
                        <div className="bg-slate-800 border-b-2 border-amber-500 rounded-xl p-3 text-center min-h-[64px] flex items-center justify-center shadow-lg">
                          <h3 className="text-xs md:text-sm font-extrabold text-amber-400 uppercase tracking-wide leading-tight">
                            {category.name}
                          </h3>
                        </div>
                        <div className="flex-1 flex flex-col gap-3">
                          {category.clues.map((clue, clueIndex) => (
                            <button
                              key={clue.value}
                              disabled={clue.visited}
                              onClick={() => handleClueClick(catIndex, clueIndex)}
                              className={`flex-1 min-h-[70px] md:min-h-[100px] rounded-xl flex flex-col items-center justify-center border transition-all relative overflow-hidden group ${
                                clue.visited
                                  ? 'bg-slate-950 border-slate-900 text-slate-700 cursor-not-allowed shadow-inner'
                                  : 'bg-gradient-to-b from-slate-850 to-slate-900 border-slate-800 text-amber-400 hover:border-amber-400 hover:scale-[1.02] shadow-md hover:shadow-amber-500/10 active:scale-95'
                              }`}
                            >
                              {!clue.visited && (
                                <span className="text-xl md:text-3xl font-black tracking-wider font-mono">
                                  ${clue.value}
                                </span>
                              )}
                              {clue.visited && (
                                <span className="text-xs font-semibold text-slate-500 uppercase tracking-widest flex items-center gap-1">
                                  <CheckCircleIcon /> Complete
                                </span>
                              )}
                            </button>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>

                  <div className="bg-slate-950/50 p-4 rounded-xl border border-slate-850 flex items-center justify-between text-xs text-slate-400">
                    <p className="flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                      Click any active dollar card to launch a question. Direct your student teams in turns!
                    </p>
                    <span className="hidden sm:inline">Contemporary World History II Honors Exam • June 1</span>
                  </div>
                </div>
              )}

              {activeTab === 'flashcards' && (
                <div className="bg-slate-950 rounded-2xl p-6 border border-slate-800 max-w-2xl mx-auto w-full flex flex-col items-center">
                  <div className="flex items-center gap-2 mb-6">
                    <SparklesIcon />
                    <h2 className="text-lg font-bold text-white uppercase tracking-wider">Independent Study Card Desk</h2>
                  </div>
                  
                  <div className="w-full bg-slate-900 h-1.5 rounded-full mb-8 overflow-hidden">
                    <div 
                      className="bg-amber-400 h-full transition-all duration-300"
                      style={{ width: `${((activeFlashcardIndex + 1) / allFlashcards.length) * 100}%` }}
                    ></div>
                  </div>

                  <div 
                    onClick={() => setFlashcardFlipped(!flashcardFlipped)}
                    className={`w-full min-h-[300px] bg-slate-900 hover:bg-slate-850 rounded-xl p-8 border border-slate-800 cursor-pointer flex flex-col justify-between transition-all duration-300 ${flashcardFlipped ? 'border-amber-500/50 shadow-lg shadow-amber-500/5' : ''}`}
                  >
                    <div className="flex justify-between items-start">
                      <span className="text-xs font-bold text-amber-500 bg-amber-500/10 px-2.5 py-1 rounded-full uppercase tracking-wider">
                        {allFlashcards[activeFlashcardIndex].category} (${allFlashcards[activeFlashcardIndex].value})
                      </span>
                      <span className="text-xs text-slate-500 font-mono">
                        {activeFlashcardIndex + 1} / {allFlashcards.length}
                      </span>
                    </div>

                    <div className="my-6 text-center">
                      {!flashcardFlipped ? (
                        <div>
                          <span className="text-xs text-slate-500 block mb-2 uppercase tracking-widest font-semibold">Question Prompt</span>
                          <p className="text-lg md:text-xl font-medium leading-relaxed text-white">
                            {allFlashcards[activeFlashcardIndex].question}
                          </p>
                        </div>
                      ) : (
                        <div>
                          <span className="text-xs text-amber-400 block mb-2 uppercase tracking-widest font-semibold">Official Answer</span>
                          <p className="text-lg md:text-xl font-bold text-amber-300 mb-4 leading-relaxed">
                            {allFlashcards[activeFlashcardIndex].answer}
                          </p>
                          {allFlashcards[activeFlashcardIndex].details && (
                            <p className="text-xs text-slate-400 italic mt-4 max-w-md mx-auto pt-4 border-t border-slate-800">
                              {allFlashcards[activeFlashcardIndex].details}
                            </p>
                          )}
                        </div>
                      )}
                    </div>

                    <div className="text-center text-xs text-slate-500 uppercase tracking-widest font-medium">
                      Click/Tap anywhere to flip card
                    </div>
                  </div>

                  <div className="flex justify-between w-full mt-6 gap-4">
                    <button 
                      disabled={activeFlashcardIndex === 0}
                      onClick={() => {
                        setActiveFlashcardIndex(prev => prev - 1);
                        setFlashcardFlipped(false);
                      }}
                      className="px-4 py-2 bg-slate-900 border border-slate-800 text-xs text-slate-300 rounded-lg hover:bg-slate-800 disabled:opacity-50 transition-all flex items-center gap-1"
                    >
                      Previous
                    </button>
                    <button 
                      onClick={() => setFlashcardFlipped(!flashcardFlipped)}
                      className="px-6 py-2 bg-slate-800 text-amber-400 hover:text-amber-300 text-xs font-semibold rounded-lg hover:bg-slate-700 transition-all"
                    >
                      Flip Card
                    </button>
                    <button 
                      disabled={activeFlashcardIndex === allFlashcards.length - 1}
                      onClick={() => {
                        setActiveFlashcardIndex(prev => prev + 1);
                        setFlashcardFlipped(false);
                      }}
                      className="px-4 py-2 bg-slate-900 border border-slate-800 text-xs text-slate-300 rounded-lg hover:bg-slate-800 disabled:opacity-50 transition-all flex items-center gap-1"
                    >
                      Next
                    </button>
                  </div>
                </div>
              )}

              {activeTab === 'final-jeopardy' && (
                <div className="bg-gradient-to-b from-slate-950 to-slate-900 rounded-2xl p-6 border-2 border-rose-500/30 max-w-3xl mx-auto w-full flex flex-col items-center relative overflow-hidden shadow-2xl">
                  <div className="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-rose-500 via-amber-500 to-rose-500"></div>
                  
                  <div className="flex items-center gap-2 mb-6 mt-4">
                    <FlameIcon />
                    <h2 className="text-2xl font-black text-rose-400 tracking-wider text-center uppercase">
                      Final Jeopardy Round
                    </h2>
                  </div>

                  <div className="text-center mb-8 max-w-xl">
                    <span className="text-xs text-amber-400 font-extrabold uppercase tracking-widest bg-amber-500/15 px-3 py-1 rounded-full border border-amber-500/20">
                      Category: {FINAL_JEOPARDY.category}
                    </span>
                    <p className="text-slate-400 text-sm mt-3">
                      Decide on wager amounts with your team sheets before displaying the final open-ended question.
                    </p>
                  </div>

                  <div className="w-full bg-slate-950 border border-slate-850 rounded-xl p-8 mb-8 text-center shadow-inner">
                    <p className="text-xl md:text-2xl font-semibold leading-relaxed text-slate-100">
                      {FINAL_JEOPARDY.question}
                    </p>

                    {showAnswer && (
                      <div className="mt-8 pt-8 border-t border-slate-800 text-left">
                        <span className="text-xs text-rose-400 font-extrabold uppercase tracking-widest block mb-2">Ideal Honors Answer Guidelines</span>
                        <p className="text-amber-400 text-lg font-bold mb-4">
                          {FINAL_JEOPARDY.answer}
                        </p>
                        <p className="text-slate-400 text-xs leading-relaxed bg-slate-900/50 p-4 rounded-lg border border-slate-800">
                          <strong>Honors Detail Context:</strong> {FINAL_JEOPARDY.details}
                        </p>
                      </div>
                    )}
                  </div>

                  <div className="flex gap-4">
                    {!showAnswer ? (
                      <button 
                        onClick={handleRevealAnswer}
                        className="px-8 py-3 bg-rose-600 hover:bg-rose-500 text-white font-extrabold text-sm rounded-xl transition-all shadow-lg hover:scale-105"
                      >
                        Reveal Answer Prompt
                      </button>
                    ) : (
                      <button 
                        onClick={() => setShowAnswer(false)}
                        className="px-8 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-extrabold text-sm rounded-xl transition-all"
                      >
                        Hide Answer
                      </button>
                    )}
                  </div>
                </div>
              )}

              {activeTab === 'study-guide' && (
                <div className="bg-slate-950 rounded-2xl p-6 border border-slate-800 shadow-xl max-w-4xl mx-auto w-full">
                  <div className="flex items-center gap-2 mb-6 border-b border-slate-800 pb-4">
                    <FileTextIcon />
                    <h2 className="text-xl font-bold text-white uppercase tracking-wider">{STUDY_GUIDE_DATA.title}</h2>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {STUDY_GUIDE_DATA.sections.map((section, idx) => (
                      <div key={idx} className="bg-slate-900 p-5 rounded-xl border border-slate-850 hover:border-slate-800 transition-all">
                        <h3 className="text-sm font-extrabold text-amber-400 mb-3 uppercase tracking-wide flex items-center gap-2">
                          <span className="bg-slate-850 w-6 h-6 flex items-center justify-center rounded-lg text-xs text-slate-400">{idx+1}</span>
                          {section.title}
                        </h3>
                        <p className="text-slate-300 text-xs leading-relaxed whitespace-pre-wrap">{section.content}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

            </div>

            <div className="w-full lg:w-80 flex flex-col gap-6">
              
              <div className="bg-slate-950 rounded-2xl p-5 border border-slate-800 shadow-xl">
                <div className="flex items-center gap-2 mb-4">
                  <UsersIcon />
                  <h3 className="text-sm font-extrabold uppercase tracking-widest text-slate-200">Interactive Teams</h3>
                </div>

                <div className="flex flex-col gap-4">
                  {teams.map((team) => (
                    <div 
                      key={team.id} 
                      className="bg-slate-900 rounded-xl p-4 border border-slate-800 hover:border-slate-750 transition-all flex flex-col gap-3"
                    >
                      <div className="flex justify-between items-center">
                        <input 
                          type="text" 
                          value={team.name}
                          onChange={(e) => updateTeamName(team.id, e.target.value)}
                          className="bg-transparent border-b border-dashed border-slate-700 hover:border-slate-500 focus:border-amber-400 focus:outline-none text-slate-200 text-sm font-semibold max-w-[120px] pb-0.5"
                        />
                        <span className={`text-xl font-black font-mono tracking-wider ${team.score >= 0 ? 'text-amber-400' : 'text-rose-500'}`}>
                          ${team.score}
                        </span>
                      </div>

                      <div className="grid grid-cols-4 gap-1.5">
                        <button 
                          onClick={() => handleScoreChange(team.id, -200)}
                          className="text-[10px] bg-slate-950 hover:bg-rose-950/20 text-rose-500 py-1 border border-slate-800 rounded font-bold"
                        >
                          -200
                        </button>
                        <button 
                          onClick={() => handleScoreChange(team.id, -100)}
                          className="text-[10px] bg-slate-950 hover:bg-rose-950/20 text-rose-500 py-1 border border-slate-800 rounded font-bold"
                        >
                          -100
                        </button>
                        <button 
                          onClick={() => handleScoreChange(team.id, 100)}
                          className="text-[10px] bg-slate-950 hover:bg-emerald-950/20 text-emerald-500 py-1 border border-slate-800 rounded font-bold"
                        >
                          +100
                        </button>
                        <button 
                          onClick={() => handleScoreChange(team.id, 200)}
                          className="text-[10px] bg-slate-950 hover:bg-emerald-950/20 text-emerald-500 py-1 border border-slate-800 rounded font-bold"
                        >
                          +200
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="bg-slate-950 rounded-2xl p-5 border border-slate-800 shadow-xl flex-1 flex flex-col justify-between min-h-[250px]">
                <div>
                  <div className="flex items-center gap-2 mb-3">
                    <HelpCircleIcon />
                    <h3 className="text-sm font-extrabold uppercase tracking-widest text-slate-200">Socratic Seminar Corner</h3>
                  </div>
                  <p className="text-xs text-slate-400 leading-relaxed">
                    Remember: Your exam begins on June 1 at 9:00 AM. 10% of your grade involves defending why there is no 'one right way' to see class topics.
                  </p>
                  
                  <div className="mt-4 bg-slate-900 rounded-lg p-3.5 border border-slate-850">
                    <span className="text-[10px] font-extrabold text-amber-500 uppercase tracking-widest block mb-1">Guiding Prompt</span>
                    <p className="text-slate-200 text-xs italic leading-snug">
                      "Consider several topics discussed this year. How might it be argued that there are two differing yet simultaneously 'correct' ways to understand the same historical issue?"
                    </p>
                  </div>
                </div>

                <div className="mt-4 pt-4 border-t border-slate-850 text-center">
                  <span className="text-[10px] text-slate-500 uppercase tracking-wider block">Kohlhagen 2026 Honors Prep</span>
                </div>
              </div>

            </div>
          </main>

          {selectedClue && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl relative animate-in zoom-in-95 duration-150">
                <div className="bg-slate-950 px-6 py-4 flex justify-between items-center border-b border-slate-850">
                  <div>
                    <span className="text-xs font-bold text-amber-400 tracking-wider uppercase">
                      {selectedClue.categoryName}
                    </span>
                    <h4 className="text-xs text-slate-400 font-mono">Value: ${selectedClue.value} Clue Card</h4>
                  </div>
                  <button 
                    onClick={() => handleClueClose(false)}
                    className="text-slate-400 hover:text-slate-100 p-1.5 hover:bg-slate-850 rounded-lg transition-all"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-6 md:p-8 flex flex-col justify-between min-h-[220px]">
                  <div>
                    <span className="text-slate-500 text-[10px] font-bold uppercase tracking-widest block mb-2">Clue Statement:</span>
                    <p className="text-slate-100 text-base md:text-xl font-medium leading-relaxed">
                      {selectedClue.question}
                    </p>
                  </div>

                  {showAnswer && (
                    <div className="mt-6 pt-6 border-t border-slate-800">
                      <span className="text-amber-400 text-[10px] font-bold uppercase tracking-widest block mb-2">Ideal Honors Student Answer:</span>
                      <p className="text-amber-300 text-base md:text-lg font-bold leading-relaxed mb-3">
                        {selectedClue.answer}
                      </p>
                      {selectedClue.details && (
                        <div className="bg-slate-950 p-3.5 rounded-lg border border-slate-850 mt-3 text-xs text-slate-400 leading-relaxed">
                          <strong>Historical Context / Detail:</strong> {selectedClue.details}
                        </div>
                      )}
                    </div>
                  )}
                </div>

                <div className="bg-slate-950 px-6 py-4 border-t border-slate-850 flex flex-col sm:flex-row items-center justify-between gap-4">
                  <div className="flex gap-2">
                    {!showAnswer ? (
                      <button 
                        onClick={handleRevealAnswer}
                        className="px-6 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs rounded-lg uppercase tracking-wider transition-all"
                      >
                        Reveal Answer
                      </button>
                    ) : (
                      <button 
                        onClick={() => setShowAnswer(false)}
                        className="px-6 py-2 bg-slate-800 hover:bg-slate-750 text-slate-300 font-extrabold text-xs rounded-lg uppercase tracking-wider transition-all"
                      >
                        Hide Answer
                      </button>
                    )}
                  </div>

                  {showAnswer && (
                    <div className="flex items-center gap-2">
                      <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mr-2">Award:</span>
                      {teams.map(team => (
                        <div key={team.id} className="flex gap-1 bg-slate-900 rounded-lg p-1 border border-slate-800">
                          <span className="text-[10px] font-semibold text-slate-300 px-2 flex items-center">{team.name}:</span>
                          <button 
                            onClick={() => handleScoreChange(team.id, -selectedClue.value)}
                            className="p-1 text-xs text-rose-500 hover:bg-rose-950/20 rounded"
                            title="Deduct"
                          >
                            <XCircleIcon />
                          </button>
                          <button 
                            onClick={() => handleScoreChange(team.id, selectedClue.value)}
                            className="p-1 text-xs text-emerald-500 hover:bg-emerald-950/20 rounded"
                            title="Award"
                          >
                            <CheckCircleIcon />
                          </button>
                        </div>
                      ))}
                    </div>
                  )}

                  <button 
                    onClick={() => handleClueClose(true)}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-750 text-slate-300 text-xs font-semibold rounded-lg transition-all"
                  >
                    Mark Done & Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {toastMessage && (
            <div className="fixed bottom-4 right-4 z-50 bg-slate-950 border border-amber-500/30 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 text-xs text-amber-400 animate-bounce">
              <SparklesIcon />
              <span>{toastMessage}</span>
            </div>
          )}

          <footer className="bg-slate-950 border-t border-slate-850 py-4 mt-auto text-center text-xs text-slate-500">
            <p>© 2026 Honors Contemporary World History II Jeopardy Dashboard. Designed for Kohlhagen Exam Review.</p>
          </footer>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
